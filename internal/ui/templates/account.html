{{define "content"}}
<h1>账号</h1>

<!-- 改密码 -->
<section class="card" aria-labelledby="pw-title">
  <h2 id="pw-title">修改密码</h2>
  <div class="tabs" role="tablist" aria-label="修改密码方式">
    <button type="button" class="tab" role="tab" id="tab-pw-old" aria-selected="true" aria-controls="pane-pw-old">用原密码</button>
    <button type="button" class="tab" role="tab" id="tab-pw-code" aria-selected="false" aria-controls="pane-pw-code">用邮箱验证码</button>
  </div>

  <form id="pane-pw-old" role="tabpanel" aria-labelledby="tab-pw-old">
    <label class="field"><span>原密码</span>
      <input type="password" id="pw-old" autocomplete="current-password" required>
    </label>
    <label class="field"><span>新密码（至少 8 位）</span>
      <input type="password" id="pw-new" autocomplete="new-password" required>
    </label>
    <p class="err" id="pw-old-error" role="alert" hidden></p>
    <button type="submit" class="btn primary">更新密码</button>
  </form>

  <form id="pane-pw-code" role="tabpanel" aria-labelledby="tab-pw-code" class="hidden">
    <p class="hint">验证码发到本账号的绑定邮箱。</p>
    <div class="row">
      <button type="button" class="btn" id="send-pw-code">获取验证码</button>
    </div>
    <label class="field"><span>验证码（6 位）</span>
      <input type="text" id="pw-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
    </label>
    <label class="field"><span>新密码（至少 8 位）</span>
      <input type="password" id="pw-code-new" autocomplete="new-password" required>
    </label>
    <p class="err" id="pw-code-error" role="alert" hidden></p>
    <button type="submit" class="btn primary">更新密码</button>
  </form>
  <p class="hint" style="margin-top:10px">改密码会把其它设备全部登出，本机保持登录。</p>
</section>

<!-- 改邮箱 -->
<section class="card" aria-labelledby="mail-title">
  <h2 id="mail-title">修改邮箱</h2>
  <p class="hint">验证码发到<strong>新</strong>邮箱；提交需要当前密码。</p>
  <div class="row">
    <button type="button" class="btn" id="send-email-code">获取验证码</button>
  </div>
  <label class="field"><span>新邮箱</span>
    <input type="email" id="email-new" autocomplete="username" required>
  </label>
  <label class="field"><span>验证码（6 位）</span>
    <input type="text" id="email-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
  </label>
  <label class="field"><span>当前密码</span>
    <input type="password" id="email-password" autocomplete="current-password" required>
  </label>
  <p class="err" id="email-error" role="alert" hidden></p>
  <button type="button" class="btn primary" id="change-email">更新邮箱</button>
  <p class="hint" style="margin-top:10px">改绑不会把其它设备登出，新旧邮箱都会收到通知。</p>
</section>

<!-- 注销 -->
<section class="card" aria-labelledby="del-title">
  <h2 id="del-title">注销账号</h2>
  <p class="hint">注销会删除本服务的账号与登录记录，并通知两个日记服务清除各自保存的业务数据。<strong>此操作不可撤销。</strong></p>
  <button type="button" class="btn danger" id="start-delete">清除数据并注销</button>
</section>

<dialog class="dlg" id="delete-dialog" aria-labelledby="dd-title">
  <form method="dialog" id="delete-form">
    <h2 id="dd-title">确认注销账号</h2>
    <p class="dim">输入当前密码以确认。注销后无法恢复，两个日记服务里的记录会被一并清除。</p>
    <label class="field"><span>当前密码</span>
      <input type="password" id="delete-password" autocomplete="current-password">
    </label>
    <p class="err" id="delete-error" role="alert" hidden></p>
    <div class="row end">
      <button type="button" class="btn" id="delete-cancel">取消</button>
      <button type="submit" class="btn danger">清除数据并注销</button>
    </div>
  </form>
</dialog>
{{end}}

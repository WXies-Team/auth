{{define "content"}}
<div class="page-head">
  <h1>AI 用量</h1>
  <label class="row" style="gap:6px"><span class="dim">近</span>
    <select id="ai-days" aria-label="统计天数">
      <option value="7">7 天</option>
      <option value="30" selected>30 天</option>
      <option value="90">90 天</option>
    </select>
  </label>
</div>

<section class="card" aria-labelledby="ai-quota-title">
  <h2 id="ai-quota-title">限额当前值</h2>
  <div class="grid2" style="margin-top:8px">
    <div><span class="dim">每分钟</span><br><strong id="q-rate">—</strong></div>
    <div><span class="dim">并发</span><br><strong id="q-conc">—</strong></div>
    <div><span class="dim">每用户每日</span><br><strong id="q-user">—</strong></div>
    <div><span class="dim">全站每日</span><br><strong id="q-global">—</strong></div>
  </div>
  <p class="hint" id="q-source"></p>
</section>

<section class="card" aria-labelledby="ai-days-title">
  <h2 id="ai-days-title">每日用量</h2>
  <p class="hint" id="ai-today"></p>
  <p class="err" id="ai-error" role="alert" hidden></p>
  <div class="bars" id="ai-bars"></div>
  <div class="empty hidden" id="ai-empty">暂无记录</div>
</section>
{{end}}

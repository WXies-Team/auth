{{define "content"}}
<div class="page-head">
  <h1>会话总览</h1>
  <span class="dim" id="sess-total"></span>
</div>

<p class="hint">先按用户列出活跃会话；点击某个用户的「查看会话」进入该用户的会话列表，可逐条退出。项目切换器（顶部）只过滤授权范围内的会话。</p>

<!-- 层级一：用户列表 -->
<div id="sess-users-view">
  <!-- 搜索行自带 16px 下边距（站内 --gap 节奏）：#sess-users-view 是普通块容器，
       .content 网格的 gap 只作用于它的直接子项，延伸不进来——缺了它搜索行与
       下方卡片黏连（2026-10-22 用户实报）。 -->
  <form class="toolbar" id="sess-user-search-form" role="search">
    <div class="toolbar-row">
      <label class="field"><span>用户</span>
        <input type="text" id="sess-user-query" placeholder="邮箱片段或 uid" autocomplete="off">
      </label>
      <!-- IP 检索：管理侧会话排查的标准能力（按来源地址找会话） -->
      <label class="field"><span>IP</span>
        <input type="text" id="sess-user-ip" placeholder="如 114.86 或 2408:" autocomplete="off">
      </label>
    </div>
    <div class="toolbar-actions">
      <button type="submit" class="btn primary">{{icon "search"}} 搜索</button>
    </div>
  </form>

  <p class="err" id="sess-error" role="alert" hidden></p>

  <div class="table-wrap">
    <table>
      <caption class="sr-only">有活跃会话的用户</caption>
      <thead>
        <tr><th>用户</th><th>uid</th><th>会话数</th><th>最近活跃</th><th></th></tr>
      </thead>
      <tbody id="sess-users-body">
        <tr><td colspan="5"><span class="skeleton sk-line w60"></span><span class="skeleton sk-line w40"></span></td></tr>
<tr><td colspan="5"><span class="skeleton sk-line w60"></span><span class="skeleton sk-line w40"></span></td></tr>
<tr><td colspan="5"><span class="skeleton sk-line w60"></span><span class="skeleton sk-line w40"></span></td></tr>
      </tbody>
    </table>
  </div>

  <div class="row" style="justify-content:flex-end;margin-top:10px">
    <button type="button" class="btn small" id="sess-prev">上一页</button>
    <span class="dim" id="sess-page">—</span>
    <button type="button" class="btn small" id="sess-next">下一页</button>
  </div>
</div>

<!-- 层级二：单用户会话列表（页内滑入） -->
<section class="card detail hidden" id="sess-detail" aria-labelledby="sd-title" aria-live="polite">
  <div class="row between">
    <h2 id="sd-title">用户会话</h2>
    <button type="button" class="btn ghost" id="sd-close">返回用户列表</button>
  </div>
  <p class="hint" id="sd-meta"></p>
  <div class="list" id="sd-body"></div>
</section>
{{end}}

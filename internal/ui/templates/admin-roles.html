{{define "content"}}
<div class="page-head">
  <h1>角色管理</h1>
  <span class="dim" id="roles-total"></span>
</div>

<p class="hint">授予/回收应用即成为该应用的管理员（app-admin）：只能管理该应用范围内的会话、用量与审计。平台角色（super）管全部应用与全局配置；只有平台管理员能调整角色。</p>

<form class="row" id="roles-search-form" role="search">
  <label class="field grow" style="margin:0"><span class="sr-only">搜索用户</span>
    <input type="text" id="roles-query" placeholder="按邮箱片段或 uid 搜索" autocomplete="off">
  </label>
  <button type="submit" class="btn">{{icon "search"}} 搜索</button>
</form>

<p class="err" id="roles-error" role="alert" hidden></p>

<div class="table-wrap">
  <table>
    <caption class="sr-only">用户角色与应用授权</caption>
    <thead>
      <tr><th>邮箱</th><th>uid</th><th>角色</th><th>应用授权</th><th></th></tr>
    </thead>
    <tbody id="roles-body">
      <tr><td colspan="5" class="empty">读取中…</td></tr>
    </tbody>
  </table>
</div>

<div class="row" style="justify-content:flex-end;margin-top:10px">
  <button type="button" class="btn small" id="roles-prev">上一页</button>
  <span class="dim" id="roles-page">—</span>
  <button type="button" class="btn small" id="roles-next">下一页</button>
</div>

<!-- 管理面板：应用授权 chips + 平台角色调整 -->
<section class="card detail hidden" id="role-detail" aria-labelledby="rd-title" aria-live="polite">
  <div class="row between">
    <h2 id="rd-title">权限管理</h2>
    <button type="button" class="btn ghost" id="rd-close">关闭</button>
  </div>
  <div id="rd-body"></div>
</section>

<dialog class="dlg" id="role-dialog" aria-labelledby="role-dlg-title">
  <form method="dialog" id="role-dlg-form">
    <h2 id="role-dlg-title">确认操作</h2>
    <p class="dim" id="role-dlg-desc"></p>
    <p class="err" id="role-dlg-error" role="alert" hidden></p>
    <div class="row end">
      <button type="button" class="btn" id="role-dlg-cancel">取消</button>
      <button type="submit" class="btn primary" id="role-dlg-ok">确认</button>
    </div>
  </form>
</dialog>
{{end}}

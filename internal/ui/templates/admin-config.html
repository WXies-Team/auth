{{define "content"}}
<div class="page-head">
  <h1>配置中心</h1>
  <span class="dim">改动 ≤10 秒热生效</span>
</div>

<p class="hint">凭据类只显示末 4 位，原值不会回传到浏览器；留空提交表示不修改，要清掉用「清除」。</p>
<p class="err" id="cfg-error" role="alert" hidden></p>

<div class="stack" id="cfg-groups" aria-live="polite">
  <div class="empty">读取中…</div>
</div>

<dialog class="dlg" id="cfg-dialog" aria-labelledby="cfg-title">
  <form method="dialog" id="cfg-form">
    <h2 id="cfg-title">清除配置</h2>
    <p class="dim" id="cfg-desc"></p>
    <p class="err" id="cfg-dialog-error" role="alert" hidden></p>
    <div class="row end">
      <button type="button" class="btn" id="cfg-cancel">取消</button>
      <button type="submit" class="btn danger">清除</button>
    </div>
  </form>
</dialog>
{{end}}

{{define "content"}}
<div class="login-shell">
  <div class="brand-lg"><img class="ico" src="/favicon.svg" alt="" width="28" height="28"><span class="name">Auth</span></div>

  {{with .Invite}}
  {{if .ErrorTitle}}
  <!-- 错误页变体（学 authorize.html 双变体做法）：出错原因 + 一条出路，零 JS -->
  <div class="card" id="invite-error">
    <h2>{{.ErrorTitle}}</h2>
    <p class="dim" style="margin-top:8px">{{.ErrorMessage}}</p>
    <a class="btn" href="/web/login" style="width:100%;margin-top:14px">前往登录</a>
  </div>
  {{else}}
  <!-- 接受表单变体：邮箱只读（邀请信已把收件人钉死）+ 设置密码 + 可选昵称，
       纯 HTML 表单 POST（零 JS），提交成功由服务端 302 进控制台并种会话 cookie -->
  <div class="card" id="invite-card">
    <h2>接受邀请</h2>
    <p class="dim" style="margin-top:6px">你被邀请以 <span class="mono">{{.Email}}</span> 注册{{if .AppName}}，并加入「{{.AppName}}」{{end}}。</p>
    <form method="post" action="/web/invite" style="margin-top:12px">
      <input type="hidden" name="token" value="{{.Token}}">
      <label class="field"><span>邮箱</span>
        <input type="email" value="{{.Email}}" readonly autocomplete="username">
      </label>
      <label class="field"><span>设置密码（至少 8 位）</span>
        <input type="password" name="password" autocomplete="new-password" minlength="8" required>
      </label>
      <label class="field"><span>昵称（选填）</span>
        <input type="text" name="nickname" autocomplete="nickname" maxlength="64">
      </label>
      {{if .Error}}<p class="err" role="alert">{{.Error}}</p>{{end}}
      <button type="submit" class="btn primary" style="width:100%">设置密码并完成注册</button>
    </form>
    <p class="hint" style="margin-top:12px">邀请链接 24 小时内有效，且只能使用一次。</p>
  </div>
  {{end}}
  {{end}}
</div>
{{end}}

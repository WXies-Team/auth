{{define "content"}}
<div class="page-head">
  <h1>概览</h1>
  <!-- 徽标的 display:inline-flex 盖过 UA 的 [hidden]，显隐一律走 .hidden 类 -->
  <span class="badge hidden" id="role-badge">管理员</span>
</div>

<section class="card" aria-labelledby="who-title">
  <h2 id="who-title">账号</h2>
  <p><span class="dim">邮箱</span> <strong id="me-email"><span class="skeleton sk-line" style="width:180px;display:inline-block"></span></strong></p>
  <!-- 最近登录：Google 安全检查页的标配信息，帮助用户发现异常活动。
       数据取现有 /api/sessions 的首条（服务端已按 last_seen_at DESC 排序），无需新端点。 -->
  <p class="hint" id="me-last-login"><span class="skeleton sk-line" style="width:220px;display:inline-block"></span></p>
  <p class="hint" id="me-meta">可随时在「登录会话」页退出某台设备。</p>
  <div class="row" style="margin-top:12px">
    <a class="btn" href="/web/console/sessions">{{icon "monitor-smartphone"}} 管理已登录设备</a>
    <button type="button" class="btn danger" id="logout">{{icon "log-out"}} 退出登录</button>
  </div>
</section>

<section class="card" aria-labelledby="sec-title">
  <h2 id="sec-title">登录方式与安全</h2>
  <div class="list" style="margin-top:8px">
    <div class="item">
      <span class="ico-wrap">{{icon "lock"}}</span>
      <span class="grow"><span class="title">密码</span><br><span class="meta" id="stat-password"><span class="skeleton sk-line" style="width:56px;display:inline-block;vertical-align:middle"></span></span></span>
      <a class="btn small" href="/web/console/account">管理</a>
    </div>
    <div class="item">
      <span class="ico-wrap">{{icon "shield-check"}}</span>
      <span class="grow"><span class="title">两步验证</span><br><span class="meta" id="stat-totp"><span class="skeleton sk-line" style="width:56px;display:inline-block;vertical-align:middle"></span></span></span>
      <a class="btn small" href="/web/console/security">管理</a>
    </div>
    <div class="item">
      <span class="ico-wrap">{{icon "key-round"}}</span>
      <span class="grow"><span class="title">Passkey</span><br><span class="meta" id="stat-passkey"><span class="skeleton sk-line" style="width:56px;display:inline-block;vertical-align:middle"></span></span></span>
      <a class="btn small" href="/web/console/passkeys">管理</a>
    </div>
  </div>
  <p class="hint" style="margin-top:10px">至少保留一种登录方式：只有密码、两步验证或 Passkey 至少有其一，账号才进得来。</p>
</section>

{{end}}

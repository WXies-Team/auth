{{define "content"}}
<div class="login-shell">
  <div class="brand-lg"><img class="ico" src="/favicon.svg" alt="" width="28" height="28"><span class="name">Auth</span></div>

  <div class="card" id="login-card">
    <div class="tabs" role="tablist" aria-label="登录方式">
      <button type="button" class="tab" role="tab" id="tab-password" aria-selected="true" aria-controls="pane-password">密码登录</button>
      <button type="button" class="tab" role="tab" id="tab-code" aria-selected="false" aria-controls="pane-code">验证码登录</button>
      <button type="button" class="tab" role="tab" id="tab-reset" aria-selected="false" aria-controls="pane-reset">找回密码</button>
    </div>

    <!-- 密码登录（两步验证时原地换成验证码输入） -->
    <form id="pane-password" role="tabpanel" aria-labelledby="tab-password">
      <div id="step-password">
        <label class="field"><span>邮箱</span>
          <input type="email" id="login-email" autocomplete="username" required>
        </label>
        <label class="field"><span>密码</span>
          <input type="password" id="login-password" autocomplete="current-password" required>
        </label>
      </div>
      <div id="step-totp" class="hidden">
        <p class="hint" id="totp-intro">该账号已开启两步验证：有验证器就填 6 位验证码，没有就填一个恢复码，二选一。</p>
        <label class="field"><span>两步验证码（6 位）</span>
          <input type="text" id="login-code-2fa" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
        </label>
        <label class="field"><span>恢复码（XXXX-XXXX-XXXX-XXXX）</span>
          <input type="text" id="login-recovery" autocomplete="off">
        </label>
        <button type="button" class="btn ghost small" id="back-to-password">换用密码登录</button>
      </div>
      <p class="err" id="login-error" role="alert" hidden></p>
      <button type="submit" class="btn primary" id="login-submit" style="width:100%">登录</button>
    </form>

    <!-- 邮箱验证码登录 -->
    <form id="pane-code" role="tabpanel" aria-labelledby="tab-code" class="hidden">
      <label class="field"><span>邮箱</span>
        <input type="email" id="code-email" autocomplete="username" required>
      </label>
      <label class="field"><span>验证码（6 位）</span>
        <span class="row" style="gap:8px">
          <input type="text" id="code-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
          <button type="button" class="btn" id="send-code">获取验证码</button>
        </span>
      </label>
      <p class="hint">验证码 5 分钟内有效，每封邮件 60 秒内只能再发一次。</p>
      <p class="err" id="code-error" role="alert" hidden></p>
      <button type="submit" class="btn primary" style="width:100%">登录</button>
    </form>

    <!-- 找回密码（走已有的验证码重置端点） -->
    <form id="pane-reset" role="tabpanel" aria-labelledby="tab-reset" class="hidden">
      <label class="field"><span>注册邮箱</span>
        <input type="email" id="reset-email" autocomplete="username" required>
      </label>
      <label class="field"><span>验证码（6 位）</span>
        <span class="row" style="gap:8px">
          <input type="text" id="reset-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
          <button type="button" class="btn" id="send-reset-code">获取验证码</button>
        </span>
      </label>
      <label class="field"><span>新密码（至少 8 位）</span>
        <input type="password" id="reset-password" autocomplete="new-password" required>
      </label>
      <p class="hint">重置会把已登录的设备全部登出。</p>
      <p class="err" id="reset-error" role="alert" hidden></p>
      <button type="submit" class="btn primary" style="width:100%">重置密码</button>
    </form>

    <div class="or" id="passkey-sep" hidden>或</div>
    <button type="button" class="btn" id="passkey-login" hidden style="width:100%">{{icon "key-round"}} 使用 Passkey 登录</button>
    <p class="err" id="passkey-error" role="alert" hidden></p>
  </div>

  <p class="dim" style="text-align:center;margin-top:14px;font-size:13px">
    支持密码、邮箱验证码与 Passkey；两步验证会在密码通过后追加一步。
  </p>
</div>
{{end}}

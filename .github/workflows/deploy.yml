name: deploy

# 推送 main 即部署到 oauth.horatio.cn（宝塔站点 /www/wwwroot/oauth.horatio.cn）。
#
# 设计说明（对齐全局模板 build.yml 的惯例）：
# - 路径过滤：纯文档不触发部署；workflow 自身改动也不触发（避免密钥/配置调整空跑）。
# - rsync 排除清单是**服务器侧文件的保护壳**（AGENTS.md Deploy sync 规则）：
#   .env / storage 运行时数据 / OAuth 签名私钥 / 面板文件（.user.ini/.htaccess/.well-known）
#   一律不同步、不删除；AGENTS.md 绝不上线（公开仓库，泄露即暴露仓库结构与规则）。
# - 用 --delete 保持代码与仓库一致，但排除清单内的文件不会被删（rsync 语义）；
#   加 --max-delete 兜底，mass deletion 时中止而非清空站点。
# - 远端 artisan 命令在迁移成功后执行；迁移失败即 job 失败，旧代码仍在线上（vendor 未替换前）。
# - 队列 worker（back-channel 登出通知）由服务器 systemd 维护，不在此处理。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      # 依赖安装在 runner 本地做（构建产物 = vendor + public/build）。
      # composer 用用户目录的新版（系统 /usr/bin/composer 过旧，见仓库提交说明）。
      # **必须显式给 HOME**：self-hosted runner 的 step 进程无 HOME（build.yml 坑19），
      # composer 的缓存目录与 npm 的用户目录都依赖它；只设在这两个 step，
      # 不提到 job 级。HOME 指向工作区旁持久目录，缓存跨 run 留存。
      - name: Install PHP dependencies
        env:
          HOME: ${{ github.workspace }}/../runner-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          COMPOSER_BIN=$(command -v composer || true)
          if [ -z "$COMPOSER_BIN" ] || ! "$COMPOSER_BIN" --version 2>/dev/null | grep -qE 'Composer (2\.(2|1[0-9])|[3-9])'; then
            COMPOSER_BIN="$HOME/.local/bin/composer"
          fi
          test -x "$COMPOSER_BIN" || { echo "::error::composer 2.2+ 不可用"; exit 1; }
          "$COMPOSER_BIN" install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Build frontend
        env:
          HOME: ${{ github.workspace }}/../runner-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          npm ci --no-audit --no-fund
          npm run build

      - name: Sync to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          OAUTH_DIR: ${{ secrets.SERVER_OAUTH_DIR }}
        run: |
          set -euo pipefail
          : "${SERVER_HOST:?SERVER_HOST is required}" \
            "${SERVER_USER:?SERVER_USER is required}" \
            "${SERVER_SSH_KEY:?SERVER_SSH_KEY is required}" \
            "${OAUTH_DIR:?SERVER_OAUTH_DIR is required}"

          KEY="$RUNNER_TEMP/oauth_deploy_key"
          install -m 600 /dev/null "$KEY"
          printf '%s\n' "$SERVER_SSH_KEY" > "$KEY"
          trap 'rm -f "$KEY"' EXIT

          SSH_OPTS=(-i "$KEY" -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new -o BatchMode=yes)
          run_ssh() { ssh "${SSH_OPTS[@]}" "$SERVER_USER@$SERVER_HOST" "bash -c $(printf '%q' "$1")"; }

          echo "== [Deploy] rsync -> $OAUTH_DIR =="
          rsync -az --delete \
            --max-delete=60 \
            --exclude='.git/' \
            --exclude='.gitignore' \
            --exclude='.env' \
            --exclude='.user.ini' \
            --exclude='.htaccess' \
            --exclude='.well-known/' \
            --exclude='AGENTS.md' \
            --exclude='.ai/' \
            --exclude='.agents/' \
            --exclude='storage/' \
            --exclude='node_modules/' \
            --exclude='docs/' \
            -e "ssh -i $KEY -p $SSH_PORT -o StrictHostKeyChecking=accept-new" \
            ./ "$SERVER_USER@$SERVER_HOST:$OAUTH_DIR/"

      - name: Post-deploy (permissions, migrations, caches)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          OAUTH_DIR: ${{ secrets.SERVER_OAUTH_DIR }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/oauth_deploy_key2"
          install -m 600 /dev/null "$KEY"
          printf '%s\n' "$SERVER_SSH_KEY" > "$KEY"
          trap 'rm -f "$KEY"' EXIT

          ssh -i "$KEY" -p "$SSH_PORT" -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" \
            "bash -s" <<'EOS'
          set -euo pipefail
          cd "$1"
          PHP=/www/server/php/84/bin/php
          test -x "$PHP" || { echo "::error::服务器 PHP 8.4 不存在"; exit 1; }
          test -f .env || { echo "::error::服务器 .env 缺失（首次部署需手工引导）"; exit 1; }
          chown -R www:www storage bootstrap/cache
          chmod -R 775 storage bootstrap/cache
          chmod 600 .env storage/oauth-private.key
          "$PHP" artisan migrate --force --no-interaction
          "$PHP" artisan config:cache --no-interaction
          "$PHP" artisan route:cache --no-interaction
          "$PHP" artisan view:cache --no-interaction
          "$PHP" artisan event:cache --no-interaction
          systemctl reload php-fpm 2>/dev/null || true
          echo "== [Deploy] 完成 =="
          EOS
